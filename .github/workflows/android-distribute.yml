name: Android CI — Build & Distribute

on:
  push:
    branches: [ "main" ]
    paths:
      - "azuma new/**"
  workflow_dispatch:

jobs:
  build-and-distribute:
    name: Build Debug APK & Upload to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x "azuma new/gradlew"

      - name: Write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > "azuma new/app/google-services.json"

      - name: Write Firebase Service Account credentials
        run: echo '${{ secrets.FIREBASE_CREDENTIALS }}' > /tmp/firebase-credentials.json

      - name: Write release notes
        run: |
          echo "Build #${{ github.run_number }} — Commit: ${{ github.sha }}" > "azuma new/release-notes.txt"
          echo "Branch: ${{ github.ref_name }} — Triggered by: ${{ github.actor }}" >> "azuma new/release-notes.txt"

      - name: Build Debug APK
        working-directory: "azuma new"
        run: ./gradlew assembleDebug --stacktrace
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_CREDENTIALS_FILE: /tmp/firebase-credentials.json

      - name: Upload to Firebase App Distribution
        working-directory: "azuma new"
        run: ./gradlew appDistributionUploadDebug --stacktrace
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_CREDENTIALS_FILE: /tmp/firebase-credentials.json

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: azooma-debug-${{ github.run_number }}
          path: "azuma new/app/build/outputs/apk/debug/app-debug.apk"
          retention-days: 14
