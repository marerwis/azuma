name: Android CI — Build & Distribute

on:
  push:
    branches: [ "main" ]
    paths:
      - "azuma new/**"
  workflow_dispatch:

jobs:
  build-and-distribute:
    name: Build Debug APK & Upload to Firebase
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 (setup-java@v5 — latest) ─────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      # ── 3. Grant gradlew execute permission ─────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x "azuma new/gradlew"

      # ── 4. Write google-services.json from secret ────────────────────────────
      - name: Write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > "azuma new/app/google-services.json"

      # ── 5. Write Firebase Service Account key from secret ────────────────────
      - name: Write Firebase credentials
        run: echo '${{ secrets.FIREBASE_CREDENTIALS }}' > /tmp/firebase-credentials.json

      # ── 6. Build the debug APK ───────────────────────────────────────────────
      - name: Build Debug APK
        working-directory: "azuma new"
        run: ./gradlew assembleDebug --stacktrace

      # ── 7. Upload to Firebase App Distribution via CLI flags ─────────────────
      - name: Upload to Firebase App Distribution
        working-directory: "azuma new"
        run: |
          ./gradlew appDistributionUploadDebug \
            --app="${{ secrets.FIREBASE_APP_ID }}" \
            --serviceCredentialsFile="/tmp/firebase-credentials.json" \
            --releaseNotes="Build #${{ github.run_number }} | ${{ github.sha }} | ${{ github.actor }}" \
            --groups="testers"

      # ── 8. Upload APK as GitHub artifact (14-day backup) ─────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: azooma-debug-${{ github.run_number }}
          path: "azuma new/app/build/outputs/apk/debug/app-debug.apk"
          retention-days: 14
